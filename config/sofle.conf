# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Grava o perfil Bluetooth ativo na flash 3 s depois da troca (o padrão é 60 s).
# Com 60 s, trocar de perfil e desligar o teclado logo em seguida perdia a escolha,
# e ao religar ele conectava no dispositivo antigo.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=3000

# Aceita um novo pareamento por cima de um pareamento antigo do mesmo dispositivo.
# Sem isso, se o Mac "esquece" o teclado mas o teclado ainda guarda a chave antiga,
# o Mac fica carregando para sempre e nunca termina de conectar.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# A opção acima liga a digitação de senha no pareamento por padrão; mantemos desligada.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_POINTING=y

# Display: roda o trabalho do OLED numa thread dedicada
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Avatar animado (zmk-nice-oled): gato no OLED dos dois lados
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
